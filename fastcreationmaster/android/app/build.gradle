    implementation fileTree(dir: './libs', include: ['if_encryptor-1.0.0-rc.5.aar'])
    implementation fileTree(dir: './libs', include: ['plugin-aggregation-0.0.1.aar'])
    implementation fileTree(dir: './libs', include: ['RangersAppLog-Lite-cn-6.16.9.aar'])
    implementation fileTree(dir: './libs', include: ['RangersAppLog-Log-1.0.5.aar'])

//    implementation 'com.umeng.umsdk:common:+'//必选
//    implementation 'com.umeng.umsdk:asms:+'//必选

//    implementation 'com.tencent.bugly:crashreport:4.1.9'
